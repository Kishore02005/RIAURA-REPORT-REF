<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Brain outline - stylized top-down view -->
  <defs>
    <linearGradient id="brainGrad" x1="200" y1="50" x2="200" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8EBF0"/>
      <stop offset="100%" stop-color="#D1D5DD"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#F8FAFC" stroke="#E8EBF0" stroke-width="1"/>

  <!-- Left hemisphere -->
  <path d="M200 60 C140 60, 80 100, 70 160 C60 210, 65 260, 85 300 C100 330, 130 350, 165 360 C185 365, 195 365, 200 365"
        fill="url(#brainGrad)" stroke="#B0B8C4" stroke-width="1.5" opacity="0.9"/>

  <!-- Right hemisphere -->
  <path d="M200 60 C260 60, 320 100, 330 160 C340 210, 335 260, 315 300 C300 330, 270 350, 235 360 C215 365, 205 365, 200 365"
        fill="url(#brainGrad)" stroke="#B0B8C4" stroke-width="1.5" opacity="0.9"/>

  <!-- Central fissure -->
  <line x1="200" y1="65" x2="200" y2="360" stroke="#B0B8C4" stroke-width="1" opacity="0.6"/>

  <!-- Left hemisphere folds -->
  <path d="M130 110 C155 105, 175 120, 195 130" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>
  <path d="M100 160 C130 150, 160 165, 190 170" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>
  <path d="M90 220 C120 210, 155 225, 185 230" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>
  <path d="M105 275 C135 265, 165 280, 190 285" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>

  <!-- Right hemisphere folds -->
  <path d="M270 110 C245 105, 225 120, 205 130" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>
  <path d="M300 160 C270 150, 240 165, 210 170" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>
  <path d="M310 220 C280 210, 245 225, 215 230" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>
  <path d="M295 275 C265 265, 235 280, 210 285" fill="none" stroke="#B0B8C4" stroke-width="1" opacity="0.5"/>

  <!-- Domain overlay regions (interactive markers) -->
  <!-- Attention - Prefrontal -->
  <circle cx="200" cy="85" r="18" fill="#3B82F6" opacity="0.15" class="brain-region" data-domain="attention"/>
  <circle cx="200" cy="85" r="4" fill="#3B82F6" opacity="0.7"/>

  <!-- Memory - Temporal Lobe Left -->
  <circle cx="115" cy="200" r="18" fill="#4338CA" opacity="0.15" class="brain-region" data-domain="memory"/>
  <circle cx="115" cy="200" r="4" fill="#4338CA" opacity="0.7"/>

  <!-- Processing - Basal Ganglia -->
  <circle cx="200" cy="170" r="18" fill="#14B8A6" opacity="0.15" class="brain-region" data-domain="processing"/>
  <circle cx="200" cy="170" r="4" fill="#14B8A6" opacity="0.7"/>

  <!-- Reasoning - DLPFC Right -->
  <circle cx="285" cy="130" r="18" fill="#8B5CF6" opacity="0.15" class="brain-region" data-domain="reasoning"/>
  <circle cx="285" cy="130" r="4" fill="#8B5CF6" opacity="0.7"/>

  <!-- Decision Integrity - ACC -->
  <circle cx="200" cy="230" r="18" fill="#475569" opacity="0.15" class="brain-region" data-domain="decision_integrity"/>
  <circle cx="200" cy="230" r="4" fill="#475569" opacity="0.7"/>

  <!-- Emotional Intelligence - Insula -->
  <circle cx="130" cy="270" r="18" fill="#F87171" opacity="0.15" class="brain-region" data-domain="emotional_intelligence"/>
  <circle cx="130" cy="270" r="4" fill="#F87171" opacity="0.7"/>

  <!-- Originality - DMN -->
  <circle cx="270" cy="200" r="18" fill="#D97706" opacity="0.15" class="brain-region" data-domain="originality"/>
  <circle cx="270" cy="200" r="4" fill="#D97706" opacity="0.7"/>

  <!-- Metacognition - Frontopolar -->
  <circle cx="200" cy="310" r="18" fill="#6B7280" opacity="0.15" class="brain-region" data-domain="metacognition"/>
  <circle cx="200" cy="310" r="4" fill="#6B7280" opacity="0.7"/>

  <!-- Connecting lines between regions -->
  <g opacity="0.2" stroke="#B0B8C4" stroke-width="0.5" fill="none">
    <line x1="200" y1="85" x2="285" y2="130"/>
    <line x1="200" y1="85" x2="115" y2="200"/>
    <line x1="200" y1="170" x2="200" y2="230"/>
    <line x1="285" y1="130" x2="270" y2="200"/>
    <line x1="115" y1="200" x2="130" y2="270"/>
    <line x1="200" y1="230" x2="200" y2="310"/>
    <line x1="130" y1="270" x2="200" y2="310"/>
    <line x1="270" y1="200" x2="200" y2="310"/>
  </g>
</svg>
