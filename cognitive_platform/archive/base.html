<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Intelligence Report — {{ metadata.company_name }}</title>
  <meta name="description" content="Cognitive assessment report for {{ metadata.participant_name }}">

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Design system CSS -->
  <link rel="stylesheet" href="/static/css/main.css">

  <!-- ECharts (SVG renderer only) -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  {% block body %}{% endblock %}

  <!-- Chart initialization -->
  <script src="/static/js/charts.js"></script>
  <!-- Interactive behaviors -->
  <script src="/static/js/interactions.js"></script>
</body>
</html>
